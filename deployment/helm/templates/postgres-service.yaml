apiVersion: v1
kind: Service
metadata:
  name: {{ include "telemetry.fullname" . }}-postgres
  labels:
    app: {{ include "telemetry.fullname" . }}
    component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: {{ include "telemetry.fullname" . }}
    component: postgres