{{- if .Values.retention.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "telemetry.fullname" . }}-retention
  labels:
    app: {{ include "telemetry.name" . }}
    component: retention
spec:
  schedule: "{{ .Values.retention.schedule }}"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: retention
              image: postgres:15
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "telemetry.fullname" . }}-postgres
                      key: POSTGRES_PASSWORD
                - name: PGHOST
                  value: {{ .Values.postgres.host | quote }}
                - name: PGPORT
                  value: {{ .Values.postgres.port | quote }}
                - name: PGSSLMODE
                  value: {{ .Values.postgres.sslMode | quote }}
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "telemetry.fullname" . }}-postgres
                      key: POSTGRES_DB
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "telemetry.fullname" . }}-postgres
                      key: POSTGRES_USER
              command:
                - sh
                - -c
                - |
                  psql <<EOF
                  DELETE FROM telemetry
                  WHERE ts < NOW() - INTERVAL '{{ .Values.retention.retentionDays }} days';
                  EOF
{{- end }}