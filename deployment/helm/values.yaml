api:
  replicas: 1
  image:
    repository: gpu-telemetry/api
    tag: latest
  servicePort: 8081
  resources: {}

metrics:
  enabled: true
  port: "9090"

global:
  postgres:
    dsn: postgresql://telemetry:telemetry@telemetry-postgres:5432/telemetry?sslmode=disable

collector:
  replicas: 2
  image:
    repository: gpu-telemetry/collector
    tag: latest
  resources: {}

streamer:
  replicas: 1
  image:
    repository: gpu-telemetry/streamer
    tag: latest
  csvPath: "/app/metrics.csv"
  intervalMs: "1000"
  resources: {}

mq:
  image:
    repository: gpu-telemetry/mq
    tag: latest
  servicePort: 8080
  resources: {}

retention:
  enabled: true
  schedule: "0 * * * *"
  retentionDays: 1
  dbPassword: telemetry

postgresql:
  auth:
    username: telemetry
    password: telemetry
    database: telemetry

  primary:
    persistence:
      enabled: true
      size: 5Gi
