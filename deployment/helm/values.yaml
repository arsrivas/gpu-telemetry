api:
  replicas: 1
  image:
    repository: gpu-telemetry/api
    tag: latest
  servicePort: 8081
  resources: {}
  logLevel: info

metrics:
  enabled: true
  port: "9090"

global:
  logLevel: info

postgres:
  host: telemetry-postgres
  port: 5432
  sslMode: disable

collector:
  replicas: 2
  image:
    repository: gpu-telemetry/collector
    tag: latest
  resources: {}
  logLevel: info

streamer:
  replicas: 1
  image:
    repository: gpu-telemetry/streamer
    tag: latest
  csvPath: "/app/metrics.csv"
  intervalMs: "1000"
  resources: {}
  logLevel: info

mq:
  image:
    repository: gpu-telemetry/mq
    tag: latest
  servicePort: 8080
  resources: {}
  partitions: 4
  logLevel: info

retention:
  enabled: true
  schedule: "*/30 * * * *"
  retentionDays: 1

postgresql:
  primary:
    persistence:
      enabled: true
      size: 5Gi
